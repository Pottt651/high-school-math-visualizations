name: Build and verify courseware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courseware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Rebuild standalone HTML
        run: npm run build
      - name: Check generated files match source
        run: git diff --exit-code -- '*.html'
      - name: Verify mathematics and browser interactions
        run: npm test
      - name: Upload offline courseware
        uses: actions/upload-artifact@v7
        with:
          name: high-school-math-visualizations
          path: |
            index.html
            papers/*/index.html
            嘉定一模_互动讲题.html
            宝山一模_互动讲题.html
            *2024一模_互动讲题.html
            *2025一模_互动讲题.html
          if-no-files-found: error
          retention-days: 30
